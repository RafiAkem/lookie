<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- LAYER CONTRACT lookie: body (plus .hand .hand-l .hand-r), eyes, pupils,
       eye-arc, eye-closed, eye-x, eye-wink, mouths (m-happy m-flat m-o m-big
       m-sad m-slant), blush. Keep these classes in custom templates. -->
  <g class="body" stroke="#1d4ed8" stroke-width="5" stroke-linejoin="round">
    <rect x="74" y="156" width="22" height="28" rx="11" fill="#2563eb"/>
    <rect x="106" y="156" width="22" height="28" rx="11" fill="#2563eb"/>
    <circle class="hand hand-l" cx="40" cy="126" r="13" fill="#2563eb"/>
    <circle class="hand hand-r" cx="160" cy="126" r="13" fill="#2563eb"/>
    <path d="M100 26 C138 22 178 44 180 88 C182 132 150 172 104 174 C58 176 18 142 22 94 C26 48 62 30 100 26 Z" fill="#2563eb"/>
    <ellipse cx="74" cy="58" rx="24" ry="14" fill="#ffffff" fill-opacity=".14" stroke="none" transform="rotate(-14 74 58)"/>
  </g>
  <g class="eye-arc" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M64 92 Q74 80 84 92"/>
    <path d="M118 92 Q128 80 138 92"/>
  </g>
  <g class="eye-closed" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M64 92 Q74 98 84 92"/>
    <path d="M118 92 Q128 98 138 92"/>
  </g>
  <g class="eye-x" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round">
    <path d="M64 84 L84 104 M84 84 L64 104"/>
    <path d="M118 84 L138 104 M138 84 L118 104"/>
  </g>
  <g class="eye-wink" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M62 92 Q74 100 86 92"/>
  </g>
  <g class="eyes">
    <ellipse cx="74" cy="94" rx="13" ry="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="4"/>
    <ellipse cx="128" cy="94" rx="13" ry="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="4"/>
  </g>
  <g class="pupils">
    <circle cx="76" cy="95" r="6" fill="#0f172a"/>
    <circle cx="130" cy="95" r="6" fill="#0f172a"/>
  </g>
  <g class="blush" stroke="none">
    <circle cx="54" cy="114" r="7" fill="#1d4ed8" fill-opacity=".16"/>
    <circle cx="148" cy="114" r="7" fill="#1d4ed8" fill-opacity=".16"/>
  </g>
  <g class="mouths">
    <path class="m-happy" d="M88 121 Q100 133 112 121" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path class="m-flat" d="M88 125 H112" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path class="m-o" d="M93 118 Q100 112 107 118 Q100 130 93 118 Z" fill="#1d4ed8"/>
    <path class="m-big" d="M84 114 Q100 144 116 114" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path class="m-sad" d="M88 132 Q100 118 112 132" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path class="m-slant" d="M90 127 Q100 121 110 123" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
</svg>