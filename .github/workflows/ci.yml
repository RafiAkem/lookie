name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (library + web)
        run: npm run build

      - name: Size budget (lookie)
        run: npm run size -w lookie

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: lookie-web-out
          path: apps/web/out
          retention-days: 7
