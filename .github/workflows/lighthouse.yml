name: lighthouse

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build -w lookie
      - run: npm run build -w web

      - name: Run Lighthouse on static export
        run: |
          npx lhci autorun --config=.lighthouseci.json
        env:
          LHCI_CHROME_PATH: /usr/bin/google-chrome
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse report artifact
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
        if: always()